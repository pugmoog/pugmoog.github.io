<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pugmoog Proxy</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #f7f2e8; background: #111827; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; gap: .65rem; padding: .75rem; background: #1f2937; border-bottom: 1px solid #374151; }
    form { display: flex; gap: .65rem; width: 100%; }
    input { flex: 1; min-width: 0; border: 1px solid #4b5563; border-radius: .65rem; padding: .7rem .85rem; color: inherit; background: #111827; font: inherit; }
    button { border: 0; border-radius: .65rem; padding: .7rem 1rem; color: #101827; background: #a7f3d0; font: 700 1rem/1 inherit; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    .empty { display: grid; place-items: center; color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <form id="proxy-form">
      <input id="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://example.com" aria-label="Website URL" required>
      <button type="submit">Open</button>
    </form>
  </header>
  <div id="stage" class="empty">Enter a public website above.</div>
  <script>
    const BACKEND = 'https://d3txi12i3pqbxm.cloudfront.net';
    const form = document.querySelector('#proxy-form');
    const input = document.querySelector('#url');
    const stage = document.querySelector('#stage');

    function normalizeUrl(value) {
      const trimmed = value.trim();
      return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    }

    function openUrl(value) {
      const url = normalizeUrl(value);
      new URL(url);
      stage.className = '';
      stage.innerHTML = '';
      const frame = document.createElement('iframe');
      frame.referrerPolicy = 'no-referrer';
      frame.allow = 'fullscreen';
      frame.src = `${BACKEND}/?url=${encodeURIComponent(url)}`;
      frame.title = `Proxied view of ${url}`;
      stage.appendChild(frame);
      history.replaceState(null, '', `?url=${encodeURIComponent(url)}`);
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      try { openUrl(input.value); }
      catch { input.setCustomValidity('Enter a valid website address.'); input.reportValidity(); }
    });
    input.addEventListener('input', () => input.setCustomValidity(''));

    const initial = new URLSearchParams(location.search).get('url');
    if (initial) { input.value = initial; openUrl(initial); }
  </script>
</body>
</html>
